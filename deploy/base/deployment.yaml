---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: std-dive-gas-tracker-web
  labels:
    app: std-dive-gas-tracker-web
    app.kubernetes.io/name: std-dive-gas-tracker-web
spec:
  replicas: 1
  selector:
    matchLabels: { app: std-dive-gas-tracker-web }
  template:
    metadata:
      labels:
        app: std-dive-gas-tracker-web
        app.kubernetes.io/name: std-dive-gas-tracker-web
    spec:
      containers:
        - name: web
          image: ${WEB_IMAGE}   # dev -> :<tag>-staging, prod -> :<tag>
          ports:
            - { containerPort: 80 }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
