name: Build on Tag
on:
  push:
    tags: [v*]
env:
  FRONTEND_DIR: ./vue
  LINT_ENABLED: true
jobs:
  build:
    runs-on: ubuntu-latest
    # Vite bakes the API URLs per mode, so we build both:
    #   staging    -> :<tag>-staging  (deployed to std-dive-logger-dev)
    #   production -> :<tag>           (deployed to std-dive-logger-prod)
    strategy:
      fail-fast: false
      matrix:
        mode: [staging, production]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Test and Lint
        uses: ./.github/actions/test-and-lint
        with:
          frontend-dir: ${{ env.FRONTEND_DIR }}
          lint-enabled: ${{ env.LINT_ENABLED }}

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build with Dockerfile
        run: bash ./build-frontend.sh ${{ github.ref_name }} ${{ matrix.mode }}
